<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>텔레그램 200MA 터치 워치리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{--bg:#0a0e14;--card:#0d1520;--border:#21262d;--text:#f0f6fc;--muted:#8b949e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;}
.container{max-width:1100px;margin:0 auto;padding:14px 18px;}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;
  padding:1.2rem 1.8rem;border-radius:12px;margin-bottom:1rem;border:1px solid #2a3a5e;}
.header h1{font-family:Rajdhani,sans-serif;font-size:1.8rem;font-weight:700;color:#0088cc;}
.header .sub{font-size:.92rem;color:#b8cef5;margin-top:.2rem;}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.8rem 1rem;margin-bottom:1rem;}
.toolbar input[type=text]{background:#06090f;border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:.45rem .7rem;font-size:.9rem;flex:1;min-width:160px;}
.chip-btn{background:#161b22;border:1px solid var(--border);color:var(--muted);
  border-radius:20px;padding:.4rem 1rem;font-size:.85rem;font-weight:600;cursor:pointer;}
.chip-btn.active{background:#0088cc;color:#fff;border-color:#0088cc;}
.chip-btn:hover{filter:brightness(1.15);}
.stat-badge{margin-left:auto;font-size:.85rem;color:var(--muted);}
.restore-btn{background:#21262d;color:#f0f6fc;border:1px solid #444;border-radius:6px;
  padding:.4rem .9rem;font-size:.82rem;cursor:pointer;}
.restore-btn:hover{background:#30363d;}
.grid{display:grid;grid-template-columns:1fr;gap:1rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:.9rem;position:relative;}
.card .del-btn{position:absolute;top:.6rem;right:.6rem;width:26px;height:26px;
  border-radius:50%;background:#2a1216;border:1px solid #dc3545;color:#dc3545;
  cursor:pointer;font-size:.95rem;line-height:1;display:flex;align-items:center;
  justify-content:center;z-index:5;}
.card .del-btn:hover{background:#dc3545;color:#fff;}
.card-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem;
  padding-right:2rem;}
.card-head .sym{font-family:Rajdhani,sans-serif;font-size:1.35rem;font-weight:700;}
.tf-tag{display:inline-block;padding:.1rem .55rem;border-radius:6px;font-size:.75rem;font-weight:700;}
.tf-1d{background:#1f6feb33;color:#58a6ff;border:1px solid #1f6feb88;}
.tf-4h{background:#3fb95033;color:#56d364;border:1px solid #3fb95088;}
.hit-badge{padding:.1rem .5rem;border-radius:10px;font-size:.72rem;font-weight:700;
  background:#f0b90b22;border:1px solid #f0b90b66;color:#f0b90b;}
.meta-row{font-size:.78rem;color:var(--muted);margin-bottom:.5rem;}
.chart-tabs{display:flex;gap:.3rem;margin-bottom:.4rem;flex-wrap:wrap;align-items:center;}
.chart-tabs .tabs-label{font-size:.72rem;color:var(--muted);margin-right:.2rem;}
.chart-tab-btn{background:#161b22;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:.25rem .7rem;font-size:.75rem;cursor:pointer;}
.chart-tab-btn.active{background:#30363d;color:#fff;}
.chart-box-single{width:100%;height:520px;background:#06090f;border-radius:8px;overflow:hidden;}
.section-heading{display:flex;align-items:center;gap:.7rem;margin:1.3rem 0 .8rem;}
.section-heading h2{font-family:Rajdhani,sans-serif;font-size:1.3rem;font-weight:700;}
.section-heading.tf-1d-h h2{color:#58a6ff;}
.section-heading.tf-4h-h h2{color:#56d364;}
.section-heading .cnt{padding:.15rem .8rem;border-radius:20px;font-size:.85rem;font-weight:700;color:#fff;}
.section-heading.tf-1d-h .cnt{background:#1f6feb;}
.section-heading.tf-4h-h .cnt{background:#3fb950;}
.section-heading .line{flex:1;height:1px;background:var(--border);}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.95rem;}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>📡 텔레그램 200MA 터치 워치리스트</h1>
    <div class="sub">텔레그램 채널 알림 파싱 · 2026-08-14 00:00:00 KST (= 2026-08-13 15:00:00 UTC) 이후 감지 종목만 누적 · 갱신: 2026-08-14 23:51:24</div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="종목명 검색 (예: BTC)">
    <button class="chip-btn active" data-filter-tf="all">전체</button>
    <button class="chip-btn" data-filter-tf="1d">1D만</button>
    <button class="chip-btn" data-filter-tf="4h">4H만</button>
    <button class="restore-btn" id="restoreBtn">삭제 복원</button>

  <div id="section1d">

      <span class="cnt" id="cnt1d">0개</span>
      <div class="line"></div>
    </div>
    <div class="grid" id="grid1d"></div>
    <div class="empty-state" id="empty1d" style="display:none;">1D 감지 종목이 없습니다.</div>
  </div>

  <div id="section4h">
    <div class="section-heading tf-4h-h">

    <div class="grid" id="grid4h"></div>
    <div class="empty-state" id="empty4h" style="display:none;">4H 감지 종목이 없습니다.</div>
  </div>

</div>

      최초감지 ${(item.first_seen||'').slice(0,16).replace('T',' ')} · 최근감지 ${(item.last_seen||'').slice(0,16).replace('T',' ')}<br>
      감지 당시 가격 ${fmtPrice(d.price)} (알림 시각 ${d.raw_time_str || '-'})
    </div>
    <div class="chart-tabs">${chartTabsHtml}</div>
    <div class="chart-box-single" id="${chartId}"></div>
  `;

  div.querySelector('.del-btn').addEventListener('click', () => {
    excluded.add(item.symbol);
    saveExcluded(excluded);
    render();
  });

  div.querySelectorAll('.chart-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      div.querySelectorAll('.chart-tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const ex = btn.dataset.ex;
      mountSingleChart(chartId, `${EXCHANGES[ex].prefix}:${item.symbol}.P`, TF_INTERVAL[tf]);
    });
  });

  return { el: div, chartId, tv: `${EXCHANGES[exOrder[0]].prefix}:${item.symbol}.P`, interval: TF_INTERVAL[tf] };
}

function mountSingleChart(containerId, tvSymbol, interval) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  const now = Math.floor(Date.now()/1000);
  const CANDLE_COUNT = 200;
  const INTERVAL_SECONDS = { "D": 60*60*24, "240": 60*60*4 };
  const barSeconds = INTERVAL_SECONDS[interval] || 60*60*24;
  const from = now - CANDLE_COUNT * barSeconds;
  new TradingView.widget({
    autosize: true,
    symbol: tvSymbol,
    interval: interval,
    from, to: now,
    timezone: "Asia/Seoul",
    theme: "dark",
    style: "1",
    locale: "kr",
    toolbar_bg: "#0c1220",
    enable_publishing: false,
    hide_side_toolbar: true,
    hide_top_toolbar: false,
    allow_symbol_change: false,
    save_image: false,
    container_id: containerId,
    studies: [
      {id:"MASimple@tv-basicstudies", inputs:{length:200}}
    ],
    studies_overrides: {
      "moving average.plot.color":"#FF0000","moving average.plot.linewidth":2
    },
    overrides: {
      "paneProperties.background":"#06090f",
      "paneProperties.vertGridProperties.color":"#111827",
      "paneProperties.horzGridProperties.color":"#111827",
      "candleStyle.upColor":"#26a69a","candleStyle.downColor":"#ef5350",
      "candleStyle.borderUpColor":"#26a69a","candleStyle.borderDownColor":"#ef5350",
      "candleStyle.wickUpColor":"#26a69a","candleStyle.wickDownColor":"#ef5350"
    }
  });
}

function passesCommonFilter(item) {
  if (excluded.has(item.symbol)) return false;
  if (searchTerm && !item.symbol.toLowerCase().includes(searchTerm)) return false;
  return true;
}

function renderSection(tf, gridId, emptyId, cntId) {
  const grid = document.getElementById(gridId);
  const empty = document.getElementById(emptyId);
  grid.innerHTML = '';

  const candidates = ITEMS.filter(item => passesCommonFilter(item) && item.tfs[tf]);

  let shown = 0;
  candidates.forEach(item => {
    const built = buildCard(item, tf);
    if (!built) return;
    grid.appendChild(built.el);
    mountSingleChart(built.chartId, built.tv, built.interval);
    shown++;
  });

  document.getElementById(cntId).textContent = `${shown}개`;
  empty.style.display = shown === 0 ? 'block' : 'none';
  return shown;
}

function render() {
  const show1d = sectionFilter === 'all' || sectionFilter === '1d';
  const show4h = sectionFilter === 'all' || sectionFilter === '4h';
  document.getElementById('section1d').style.display = show1d ? '' : 'none';
  document.getElementById('section4h').style.display = show4h ? '' : 'none';

  let c1d = 0, c4h = 0;
  if (show1d) c1d = renderSection('1d', 'grid1d', 'empty1d', 'cnt1d');
  if (show4h) c4h = renderSection('4h', 'grid4h', 'empty4h', 'cnt4h');

  document.getElementById('statBadge').textContent =
    `표시 1D ${c1d}개 · 4H ${c4h}개 / 전체 종목 ${ITEMS.length}개 (삭제됨 ${excluded.size}개)`;
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toUpperCase();
  render();
});
document.querySelectorAll('.chip-btn[data-filter-tf]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip-btn[data-filter-tf]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    sectionFilter = btn.dataset.filterTf;
    render();
  });
});
document.getElementById('restoreBtn').addEventListener('click', () => {
  excluded = new Set();
  saveExcluded(excluded);
  render();
});

render();
</script>
</body>
</html>
